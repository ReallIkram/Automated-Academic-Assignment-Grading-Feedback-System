services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gradeflow
      POSTGRES_USER: gradeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradeflow"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  api:
    build: backend
    ports: ["127.0.0.1:8000:8000"]
    environment: &env
      DATABASE_URL: postgresql+psycopg://gradeflow:${POSTGRES_PASSWORD}@db/gradeflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: backend
    command: rq worker grading --url redis://redis:6379/0
    environment: *env
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on: [api]
volumes:
  pgdata:
  redisdata:
